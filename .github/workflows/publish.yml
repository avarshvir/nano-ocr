name: Publish to PyPI

on:
  workflow_dispatch:  # Allows you to trigger it manually from GitHub
  release:
    types: [published] # Runs automatically if you create a GitHub Release

jobs:
  pypi-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Critical: This allows PyPI to authenticate GitHub
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build the PyPI package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1